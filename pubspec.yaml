name: liquid_glass_ios_widgets
description: "Native iOS 26 Liquid Glass components (buttons, switch, slider, segmented control, glass container, tab bar) as Flutter widgets via platform views."
version: 0.3.1
repository: https://github.com/xusanFlutter/liquid_glass_ios_widgets
issue_tracker: https://github.com/xusanFlutter/liquid_glass_ios_widgets/issues
topics:
  - ios
  - liquid-glass
  - widget
  - cupertino
  - platform-views

environment:
  sdk: ^3.11.4
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiquidGlassIosWidgetsPlugin
